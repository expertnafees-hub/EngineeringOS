[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engineeringos"
version = "0.1.0"
description = "EngineeringOS CLI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer",
    "rich",
    "pyyaml",
    "jinja2"
]

[project.scripts]
engineeringos = "engineeringos.cli:app"
